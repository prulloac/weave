name: Markdown Lint

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:md

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a dry-run build (for example v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify repository
        run: ./scripts/verify.sh
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            docs/**/*.md
            README.md
            CONTRIBUTING.md
            AGENTS.md

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o dist/weave ./cmd/weave
      - name: Smoke test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          ./dist/weave version --json
          ./dist/weave contract --json
      - name: Package archive
        run: |
          go run ./cmd/release-package \
            -version "${RELEASE_TAG}" \
            -os "${{ matrix.os }}" \
            -arch "${{ matrix.arch }}" \
            -binary dist/weave \
            -root . \
            -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: weave-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  artifact-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            shell: bash
          - runner: macos-latest
            os: darwin
            arch: arm64
            shell: bash
          - runner: windows-latest
            os: windows
            arch: amd64
            shell: pwsh
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: weave-${{ matrix.os }}-${{ matrix.arch }}
          path: dist
      - name: Extract and smoke (Unix)
        if: matrix.os != 'windows'
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p smoke
          if [ "${{ matrix.os }}" = "linux" ]; then
            tar -xzf "dist/weave_${VERSION}_linux_${{ matrix.arch }}.tar.gz" -C smoke
            BINARY="$PWD/smoke/weave"
          else
            tar -xzf "dist/weave_${VERSION}_darwin_${{ matrix.arch }}.tar.gz" -C smoke
            BINARY="$PWD/smoke/weave"
          fi
          "$BINARY" version --json
          "$BINARY" contract --json
          WEAVE_SMOKE_BINARY="$BINARY" WEAVE_SMOKE_VERSION="${RELEASE_TAG}" \
            go test ./cmd/weave -run '^TestSmoke$' -count=1
      - name: Extract and smoke (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v',''
          Expand-Archive -Path "dist/weave_${version}_windows_${{ matrix.arch }}.zip" -DestinationPath smoke
          .\smoke\weave.exe version --json
          .\smoke\weave.exe contract --json
          $env:WEAVE_SMOKE_BINARY = (Resolve-Path .\smoke\weave.exe)
          $env:WEAVE_SMOKE_VERSION = $env:RELEASE_TAG
          go test ./cmd/weave -run '^TestSmoke$' -count=1

  release:
    needs: [build, artifact-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          go run ./cmd/release-package \
            -version "${RELEASE_TAG}" \
            -out dist \
            -checksums
      - name: Write build info
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          go run ./cmd/release-package \
            -version "${RELEASE_TAG}" \
            -out dist \
            -buildinfo
      - name: Verify checksums and build info
        run: |
          VERSION="${RELEASE_TAG#v}"
          (cd dist && sha256sum -c "weave_${VERSION}_checksums.txt")
          test -f "dist/weave_${VERSION}_buildinfo.txt"
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; refusing to overwrite" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${RELEASE_TAG}" in
            *-rc*|*-beta*) PRERELEASE="--prerelease" ;;
          esac
          NOTES="$(printf '%s\n' \
            'Weave is a local-first related-document database for OKF bundles.' \
            '' \
            'Install without compiling:' \
            '' \
            '```sh' \
            'curl -fsSL https://raw.githubusercontent.com/prulloac/weave/main/scripts/install.sh | sh' \
            '```' \
            '' \
            'Windows PowerShell:' \
            '' \
            '```powershell' \
            'irm https://raw.githubusercontent.com/prulloac/weave/main/scripts/install.ps1 | iex' \
            '```' \
            '' \
            'The optional AI extension lives at https://github.com/prulloac/weave-ai.' \
            '' \
            'Or download an archive below.')"
          gh release create "${RELEASE_TAG}" dist/* \
            --draft \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --notes "${NOTES}" \
            ${PRERELEASE}

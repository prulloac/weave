name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/contract-export
      - run: git diff --exit-code -- contract/v1/golden/expected
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd contract engine)" || (gofmt -l cmd contract engine && exit 1)
      - run: go build -o /tmp/weave ./cmd/weave
      - run: go run ./cmd/docs-lint

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            docs/**/*.md
            README.md
            CONTRIBUTING.md
            AGENTS.md

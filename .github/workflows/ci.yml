name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go run ./cmd/contract-export
      - run: go run ./cmd/schema-diff
      - run: test -z "$(git status --porcelain -- contract/v1/golden/expected)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -coverpkg=./... -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go build -o /tmp/weave ./cmd/weave
      - run: go run ./cmd/docs-lint

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            docs/**/*.md
            README.md
            ROADMAP.md
            CONTRIBUTING.md
            AGENTS.md
